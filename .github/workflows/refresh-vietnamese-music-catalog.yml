name: Refresh Vietnamese music catalog

on:
  workflow_dispatch:
    inputs:
      full_audius_audit:
        description: Recheck every verified seed on Audius
        required: false
        default: "false"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: family-bloom-vietnamese-music-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci --ignore-scripts
      - name: Refresh source signals and append new candidates
        run: node scripts/music/refresh-vietnamese-music-catalog.js
      - name: Audit Audius coverage
        shell: bash
        run: |
          if [ "${{ github.event.inputs.full_audius_audit }}" = "true" ]; then
            node scripts/music/audit-audius-vietnamese-catalog.js --full
          else
            node scripts/music/audit-audius-vietnamese-catalog.js
          fi
      - name: Validate Phase 14L music contracts
        run: node scripts/test-phase14l-dynamic-vietnamese-catalog.js
      - name: Commit refreshed metadata when source/provider changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "family-bloom-music-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/vietnameseMusicCatalogAdditions.generated.ts \
                  src/data/vietnameseMusicSourceSignals.generated.ts \
                  src/data/vietnameseMusicPlayableV2.generated.ts \
                  document/music-catalog/source-state.json \
                  document/music-catalog/refresh-latest.json \
                  document/music-catalog/audius-audit-latest.json
          git commit -m "chore(music): refresh Vietnamese catalog signals"
          git push
