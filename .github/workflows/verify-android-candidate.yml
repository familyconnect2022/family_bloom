name: Verify Android candidate
on:
  push:
    branches: [test/r16r11r32-android-candidate, test/r16r11r33-android-reproducible, test/r16r11r34-moment-field, test/r16r11r36-form-draft, test/r16r11r37-draft-resume, test/r16r11r38-draft-images, test/r16r11r39-draft-autosave, test/r16r11r42-integrated, test/r16r11r43-integrated, test/r16r11r44-candidate, test/r16r11r45-candidate, test/r16r11r46-candidate, test/r16r11r47-candidate, test/r16r11r48-candidate, test/r16r11r49-candidate, test/r16r11r50-candidate, test/r16r11r51-candidate, test/r16r11r52-candidate, test/r16r11r53-candidate, test/r16r11r54-candidate, test/r16r11r55-candidate, test/r16r11r55-android-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact source bytes before installing dependencies
        run: node scripts/setup/verify-release-source.cjs
      - name: Verify editor, publish and media contracts
        run: node --test scripts/tests/release/test-family-document-foundation.cjs scripts/tests/release/test-family-editor-offline.cjs scripts/tests/release/test-family-publish-manager.cjs scripts/tests/release/test-family-field-document.cjs scripts/tests/release/test-family-media-review.cjs scripts/tests/release/test-moment-form-draft-client.cjs scripts/tests/release/test-moment-draft-resume.cjs scripts/tests/release/test-moment-draft-images.cjs scripts/tests/release/test-moment-local-recovery.cjs scripts/tests/release/test-r43-native-publish-journal.cjs scripts/tests/release/test-r44-draft-catalogue.cjs
      - name: Install dependencies in isolated CI checkout
        run: npm ci --include=dev --no-audit --no-fund
      - name: Record exact pinned dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: android-candidate-resolved-lock
          path: package-lock.json
          if-no-files-found: error
      - run: node scripts/setup/check-package-lock.js
      - run: npm run route:check
      - run: npm run source:imports-check
      - run: npm run source:syntax-check
      - name: Event transaction runtime regression
        run: node --test scripts/tests/release/test-event-transaction-runtime.cjs
      - name: TypeScript check
        run: npm run typecheck
      - run: node scripts/tests/release/test-r16r11r15-local-preflight.cjs
      - run: node scripts/tests/release/test-r33-lock-contract.cjs
      - run: npm run build:entrypoints-check
      - run: npm run phaseP2_37R2C:check
      - name: Android Metro production bundle (no deploy, no signing)
        env:
          EXPO_PUBLIC_SINGLE_SESSION_ENABLED: '1'
          EXPO_PUBLIC_SINGLE_SESSION_API_URL: https://session.example.invalid/api/session
          EXPO_PUBLIC_MOMENT_MEDIA_API_URL: https://media.example.invalid
        run: npx expo export --platform android --output-dir dist-android-ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate synthetic Firebase config for CI native build only
        run: node scripts/setup/write-ci-google-services.cjs
      - name: Generate Android project (synthetic Firebase, no production credentials)
        env:
          EXPO_PUBLIC_SINGLE_SESSION_ENABLED: '1'
          EXPO_PUBLIC_SINGLE_SESSION_API_URL: https://session.example.invalid/api/session
          EXPO_PUBLIC_MOMENT_MEDIA_API_URL: https://media.example.invalid
        run: npx --no-install expo prebuild --platform android --clean --no-install
      - run: node scripts/setup/check-generated-android-package.js com.familybloom.android
      - name: Compile unsigned Release APK, never publish or distribute
        env:
          EXPO_PUBLIC_SINGLE_SESSION_ENABLED: '1'
          EXPO_PUBLIC_SINGLE_SESSION_API_URL: https://session.example.invalid/api/session
          EXPO_PUBLIC_MOMENT_MEDIA_API_URL: https://media.example.invalid
        shell: bash
        run: |
          set -o pipefail
          printf '\nandroid { buildTypes { release { signingConfig null } } }\n' >> android/app/build.gradle
          cd android
          df -h . "$HOME/.gradle"
          free -h
          log="$RUNNER_TEMP/bloom-gradle.log"
          for attempt in 1 2; do
            if ./gradlew --no-daemon --stacktrace --console=plain :app:assembleRelease 2>&1 | tee "$log"; then
              exit 0
            fi
            df -h . "$HOME/.gradle"
            free -h
            if [ "$attempt" = 1 ] && grep -Fq "Plugin [id: 'org.gradle.toolchains.foojay-resolver-convention', version: '1.0.0'] was not found" "$log"; then
              echo 'Gradle plugin resolution failed; retrying once.'
              continue
            fi
            exit 1
          done
      - name: Upload Gradle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-diagnostics
          path: ${{ runner.temp }}/bloom-gradle.log
          if-no-files-found: ignore
      - name: Inspect APK manifest, DEX and board audio (CI only)
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          node scripts/setup/check-p2_37r2c-apk-native-proof.js "$APK"
          node scripts/setup/check-board-audio-apk.js "$APK"

  private-rules-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator test tools (no app dependency changes)
        run: |
          npm install --prefix "$RUNNER_TEMP/bloom-rules" --no-audit --no-fund firebase-tools@14 @firebase/rules-unit-testing@5 firebase@12
          npm list --prefix "$RUNNER_TEMP/bloom-rules" --depth=0
      - name: Test private paths with Firestore Emulator only
        run: |
          export BLOOM_RULES_TEST_DEPS="$RUNNER_TEMP/bloom-rules"
          "$BLOOM_RULES_TEST_DEPS/node_modules/.bin/firebase" emulators:exec --only firestore --project demo-family-bloom-r44 --config firebase.json "node scripts/tests/release/test-r44-private-rules-emulator.cjs"
