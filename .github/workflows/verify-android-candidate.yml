name: Verify Android candidate
on:
  push:
    branches: [test/r16r11r32-android-candidate, test/r16r11r33-android-reproducible, test/r16r11r34-moment-field, test/r16r11r36-form-draft, test/r16r11r37-draft-resume, test/r16r11r38-draft-images, test/r16r11r39-draft-autosave, test/r16r11r42-integrated, test/r16r11r43-integrated, test/r16r11r44-candidate, test/r16r11r45-candidate, test/r16r11r46-candidate, test/r16r11r47-candidate, test/r16r11r48-candidate, test/r16r11r49-candidate, test/r16r11r50-candidate, test/r16r11r51-candidate, test/r16r11r52-candidate, test/r16r11r53-candidate, test/r16r11r54-candidate, test/r16r11r55-candidate, test/r16r11r55-android-diagnostics, test/r16r11r57-candidate, test/r16r11r58-candidate, test/r16r11r59-candidate, test/r16r11r60-candidate, test/r16r11r67-candidate, test/r16r11r68-candidate, main, test/r16r11r69-candidate, test/r16r11r101-candidate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact source bytes before installing dependencies
        run: node scripts/setup/verify-release-source.cjs
      - name: Verify editor, publish and media contracts
        run: node --test scripts/tests/release/test-family-document-foundation.cjs scripts/tests/release/test-family-editor-offline.cjs scripts/tests/release/test-r101-native-editor-transport.cjs scripts/tests/release/test-family-publish-manager.cjs scripts/tests/release/test-family-field-document.cjs scripts/tests/release/test-family-media-review.cjs scripts/tests/release/test-moment-form-draft-client.cjs scripts/tests/release/test-moment-draft-resume.cjs scripts/tests/release/test-moment-draft-images.cjs scripts/tests/release/test-moment-local-recovery.cjs scripts/tests/release/test-r43-native-publish-journal.cjs scripts/tests/release/test-r44-draft-catalogue.cjs
      - name: Install dependencies in isolated CI checkout
        run: npm ci --include=dev --no-audit --no-fund
      - name: Record exact pinned dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: android-candidate-resolved-lock
          path: package-lock.json
          if-no-files-found: error
      - run: node scripts/setup/check-package-lock.js
      - run: npm run route:check
      - run: npm run source:imports-check
      - run: npm run source:syntax-check
      - name: Event transaction runtime regression
        run: node --test scripts/tests/release/test-event-transaction-runtime.cjs
      - name: Family article publication contract
        run: node --test scripts/tests/release/test-family-articles.cjs scripts/tests/release/test-r101-learning-parity.cjs
      - name: TypeScript check
        run: npm run typecheck
      - run: node scripts/tests/release/test-r16r11r15-local-preflight.cjs
      - run: node scripts/tests/release/test-r33-lock-contract.cjs
      - run: npm run build:entrypoints-check
      - run: npm run phaseP2_37R2C:check
      - name: Android Metro production bundle (no deploy, no signing)
        env:
          EXPO_PUBLIC_SINGLE_SESSION_ENABLED: '1'
          EXPO_PUBLIC_SINGLE_SESSION_API_URL: https://session.example.invalid/api/session
          EXPO_PUBLIC_MOMENT_MEDIA_API_URL: https://media.example.invalid
        run: npx expo export --platform android --output-dir dist-android-ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate synthetic Firebase config for CI native build only
        run: node scripts/setup/write-ci-google-services.cjs
      - name: Run pre-native Debug BAT and signed Release regression commands on CI
        env:
          EXPO_PUBLIC_SINGLE_SESSION_ENABLED: '1'
          EXPO_PUBLIC_SINGLE_SESSION_API_URL: https://session.example.invalid/api/session
          EXPO_PUBLIC_MOMENT_MEDIA_API_URL: https://media.example.invalid
        shell: bash
        run: |
          failures=0
          # Reproduce a previously built Windows workspace without using user data.
          mkdir -p release
          test ! -e release/BUILD_RESULT.txt
          printf '%s\n' 'CI synthetic signed-build report' > release/BUILD_RESULT.txt
          trap 'rm -f release/BUILD_RESULT.txt' EXIT
          echo '>>> node scripts/setup/check-expo-dependencies.js'
          if ! node scripts/setup/check-expo-dependencies.js; then echo '::error::Failed: node scripts/setup/check-expo-dependencies.js'; failures=$((failures+1)); fi
          echo '>>> node scripts/setup/check-package-lock.js'
          if ! node scripts/setup/check-package-lock.js; then echo '::error::Failed: node scripts/setup/check-package-lock.js'; failures=$((failures+1)); fi
          echo '>>> node scripts/setup/check-effective-expo-config.js'
          if ! node scripts/setup/check-effective-expo-config.js; then echo '::error::Failed: node scripts/setup/check-effective-expo-config.js'; failures=$((failures+1)); fi
          echo '>>> node scripts/setup/check-board-audio-integrity.js'
          if ! node scripts/setup/check-board-audio-integrity.js; then echo '::error::Failed: node scripts/setup/check-board-audio-integrity.js'; failures=$((failures+1)); fi
          echo '>>> node scripts/setup/check-build-entrypoints.js'
          if ! node scripts/setup/check-build-entrypoints.js; then echo '::error::Failed: node scripts/setup/check-build-entrypoints.js'; failures=$((failures+1)); fi
          echo '>>> npm run phase15a4:check'
          if ! npm run phase15a4:check; then echo '::error::Failed: npm run phase15a4:check'; failures=$((failures+1)); fi
          echo '>>> node scripts/tests/release/test-a3-render-backend-urls.cjs'
          if ! node scripts/tests/release/test-a3-render-backend-urls.cjs; then echo '::error::Failed: node scripts/tests/release/test-a3-render-backend-urls.cjs'; failures=$((failures+1)); fi
          echo '>>> npm run phaseP2_12_4:check'
          if ! npm run phaseP2_12_4:check; then echo '::error::Failed: npm run phaseP2_12_4:check'; failures=$((failures+1)); fi
          echo '>>> npm run phaseP2_12_6:check'
          if ! npm run phaseP2_12_6:check; then echo '::error::Failed: npm run phaseP2_12_6:check'; failures=$((failures+1)); fi
          echo '>>> npm run phaseP2_12_7:check'
          if ! npm run phaseP2_12_7:check; then echo '::error::Failed: npm run phaseP2_12_7:check'; failures=$((failures+1)); fi
          echo '>>> npm run phaseP2_12_8:check'
          if ! npm run phaseP2_12_8:check; then echo '::error::Failed: npm run phaseP2_12_8:check'; failures=$((failures+1)); fi
          echo '>>> npm run phaseP2_32:check'
          if ! npm run phaseP2_32:check; then echo '::error::Failed: npm run phaseP2_32:check'; failures=$((failures+1)); fi
          echo '>>> node scripts/tests/release/test-h25r2r2-release-preflight.cjs'
          if ! node scripts/tests/release/test-h25r2r2-release-preflight.cjs; then echo '::error::Failed: node scripts/tests/release/test-h25r2r2-release-preflight.cjs'; failures=$((failures+1)); fi
          echo '>>> node scripts/tests/release/test-h25r2r5-internet-connectivity.cjs --source-only'
          if ! node scripts/tests/release/test-h25r2r5-internet-connectivity.cjs --source-only; then echo '::error::Failed: node scripts/tests/release/test-h25r2r5-internet-connectivity.cjs --source-only'; failures=$((failures+1)); fi
          echo '>>> npm run phaseP2_34:check'
          if ! npm run phaseP2_34:check; then echo '::error::Failed: npm run phaseP2_34:check'; failures=$((failures+1)); fi
          echo '>>> npm run phaseP2_35:check'
          if ! npm run phaseP2_35:check; then echo '::error::Failed: npm run phaseP2_35:check'; failures=$((failures+1)); fi
          echo '>>> node scripts/setup/check-source-import-integrity.js'
          if ! node scripts/setup/check-source-import-integrity.js; then echo '::error::Failed: node scripts/setup/check-source-import-integrity.js'; failures=$((failures+1)); fi
          echo '>>> npm run phaseP2_37R2C:check'
          if ! npm run phaseP2_37R2C:check; then echo '::error::Failed: npm run phaseP2_37R2C:check'; failures=$((failures+1)); fi
          echo '>>> npm run phaseP2_37R2C_H6:check'
          if ! npm run phaseP2_37R2C_H6:check; then echo '::error::Failed: npm run phaseP2_37R2C_H6:check'; failures=$((failures+1)); fi
          echo '>>> npm run phaseP2_37R2C_H7:check'
          if ! npm run phaseP2_37R2C_H7:check; then echo '::error::Failed: npm run phaseP2_37R2C_H7:check'; failures=$((failures+1)); fi
          echo '>>> npm run phaseP2_37R2C_H8:check'
          if ! npm run phaseP2_37R2C_H8:check; then echo '::error::Failed: npm run phaseP2_37R2C_H8:check'; failures=$((failures+1)); fi
          echo '>>> npm run phaseP2_37R2C_H9A:check'
          if ! npm run phaseP2_37R2C_H9A:check; then echo '::error::Failed: npm run phaseP2_37R2C_H9A:check'; failures=$((failures+1)); fi
          echo '>>> node scripts/setup/check-expo-route-uniqueness.cjs'
          if ! node scripts/setup/check-expo-route-uniqueness.cjs; then echo '::error::Failed: node scripts/setup/check-expo-route-uniqueness.cjs'; failures=$((failures+1)); fi
          echo '>>> npm run structure:check'
          if ! npm run structure:check; then echo '::error::Failed: npm run structure:check'; failures=$((failures+1)); fi
          echo '>>> npm run phaseP2_15_5_1:check'
          if ! npm run phaseP2_15_5_1:check; then echo '::error::Failed: npm run phaseP2_15_5_1:check'; failures=$((failures+1)); fi
          echo '>>> npm run doctor:native-check'
          if ! npm run doctor:native-check; then echo '::error::Failed: npm run doctor:native-check'; failures=$((failures+1)); fi
          echo '>>> npm run release:check'
          if ! npm run release:check; then echo '::error::Failed: npm run release:check'; failures=$((failures+1)); fi
          echo '>>> npm run typecheck'
          if ! npm run typecheck; then echo '::error::Failed: npm run typecheck'; failures=$((failures+1)); fi
          echo '>>> npm run login:pill-edges-check'
          if ! npm run login:pill-edges-check; then echo '::error::Failed: npm run login:pill-edges-check'; failures=$((failures+1)); fi
          echo '>>> npm run single-session:config-check'
          if ! npm run single-session:config-check; then echo '::error::Failed: npm run single-session:config-check'; failures=$((failures+1)); fi
          echo '>>> npm run single-session:check'
          if ! npm run single-session:check; then echo '::error::Failed: npm run single-session:check'; failures=$((failures+1)); fi
          echo '>>> npm run graph:web-parity:check'
          if ! npm run graph:web-parity:check; then echo '::error::Failed: npm run graph:web-parity:check'; failures=$((failures+1)); fi
          echo '>>> npm run graph:web-dashboard:check'
          if ! npm run graph:web-dashboard:check; then echo '::error::Failed: npm run graph:web-dashboard:check'; failures=$((failures+1)); fi
          echo '>>> npm run graph:relation-choice:check'
          if ! npm run graph:relation-choice:check; then echo '::error::Failed: npm run graph:relation-choice:check'; failures=$((failures+1)); fi
          echo '>>> npm run graph:postsave:check'
          if ! npm run graph:postsave:check; then echo '::error::Failed: npm run graph:postsave:check'; failures=$((failures+1)); fi
          echo '>>> npm run android:separation:check'
          if ! npm run android:separation:check; then echo '::error::Failed: npm run android:separation:check'; failures=$((failures+1)); fi
          echo "Pre-native Debug and signed Release failures: $failures"
          test "$failures" -eq 0
      - name: Generate Android project (synthetic Firebase, no production credentials)
        env:
          EXPO_PUBLIC_SINGLE_SESSION_ENABLED: '1'
          EXPO_PUBLIC_SINGLE_SESSION_API_URL: https://session.example.invalid/api/session
          EXPO_PUBLIC_MOMENT_MEDIA_API_URL: https://media.example.invalid
        run: npx --no-install expo prebuild --platform android --clean --no-install
      - run: node scripts/setup/check-generated-android-package.js com.familybloom.android
      - name: Verify generated native identity and actual Gradle module graph
        env:
          EXPO_PUBLIC_SINGLE_SESSION_ENABLED: '1'
          EXPO_PUBLIC_SINGLE_SESSION_API_URL: https://session.example.invalid/api/session
          EXPO_PUBLIC_MOMENT_MEDIA_API_URL: https://media.example.invalid
        run: |
          printf '\norg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.workers.max=2\n' >> android/gradle.properties
          node scripts/setup/check-p2_37r2c-native-package.js --require-node-module --require-resolve --require-effective-config --require-generated-project --require-gradle-project
      - name: Compile Debug APK and verify native DEX and audio (no device or distribution)
        env:
          EXPO_PUBLIC_SINGLE_SESSION_ENABLED: '1'
          EXPO_PUBLIC_SINGLE_SESSION_API_URL: https://session.example.invalid/api/session
          EXPO_PUBLIC_MOMENT_MEDIA_API_URL: https://media.example.invalid
        shell: bash
        run: |
          (cd android && ./gradlew --no-daemon --stacktrace --console=plain --max-workers=2 :app:assembleDebug) 2>&1 | tee "$RUNNER_TEMP/bloom-debug-gradle.log"
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          node scripts/setup/check-p2_37r2c-apk-native-proof.js "$APK"
          node scripts/setup/check-board-audio-apk.js "$APK"
          rm -f "$APK"
      - name: Compile unsigned Release APK, never publish or distribute
        env:
          EXPO_PUBLIC_SINGLE_SESSION_ENABLED: '1'
          EXPO_PUBLIC_SINGLE_SESSION_API_URL: https://session.example.invalid/api/session
          EXPO_PUBLIC_MOMENT_MEDIA_API_URL: https://media.example.invalid
        shell: bash
        run: |
          set -o pipefail
          printf '\nandroid { buildTypes { release { signingConfig null } } }\n' >> android/app/build.gradle
          cd android
          df -h . "$HOME" || true
          free -h || true
          log="$RUNNER_TEMP/bloom-gradle.log"
          for attempt in 1 2 3; do
            refresh=()
            if [ "$attempt" != 1 ]; then refresh+=(--refresh-dependencies); fi
            if ./gradlew "${refresh[@]}" --no-daemon --stacktrace --console=plain --max-workers=2 :app:assembleRelease 2>&1 | tee "$log"; then
              exit 0
            fi
            df -h . "$HOME" || true
            free -h || true
            if [ "$attempt" != 3 ] && grep -Fq "Plugin [id: 'org.gradle.toolchains.foojay-resolver-convention', version: '1.0.0'] was not found" "$log"; then
              echo 'Gradle plugin resolution failed; retrying with dependency refresh.'
              sleep 15
              continue
            fi
            exit 1
          done
      - name: Upload Gradle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-diagnostics
          path: |
            ${{ runner.temp }}/bloom-gradle.log
            ${{ runner.temp }}/bloom-debug-gradle.log
          if-no-files-found: ignore
      - name: Inspect APK manifest, DEX and board audio (CI only)
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          node scripts/setup/check-p2_37r2c-apk-native-proof.js "$APK"
          node scripts/setup/check-board-audio-apk.js "$APK"

  private-rules-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator test tools (no app dependency changes)
        run: |
          npm install --prefix "$RUNNER_TEMP/bloom-rules" --no-audit --no-fund firebase-tools@14 @firebase/rules-unit-testing@5 firebase@12
          npm list --prefix "$RUNNER_TEMP/bloom-rules" --depth=0
      - name: Test private paths with Firestore Emulator only
        run: |
          export BLOOM_RULES_TEST_DEPS="$RUNNER_TEMP/bloom-rules"
          "$BLOOM_RULES_TEST_DEPS/node_modules/.bin/firebase" emulators:exec --only firestore --project demo-family-bloom-r44 --config firebase.json "node scripts/tests/release/test-r44-private-rules-emulator.cjs"
