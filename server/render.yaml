services:
  - type: web
    name: family-bloom-chess
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: CHESS_TEST_BOT_ENABLED
        sync: false
